[workspace]
members = ["crates/domain", "crates/application", "crates/live", "apps/server", "src-tauri"]
default-members = ["apps/server", "crates/domain", "crates/application", "crates/live"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
