[package]
name = "kairos-server"
version = "0.1.0"
edition = "2021"

[features]
test-support = ["kairos-application/test-support"]

[dependencies]
kairos-application = { path = "../../crates/application" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
