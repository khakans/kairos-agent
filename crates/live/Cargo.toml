[package]
name = "kairos-live"
version = "0.1.0"
edition = "2021"

[dependencies]
kairos-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
solana-address-lookup-table-interface = { version = "2.2", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "2.2"
solana-hash = "2.3"
solana-instruction = "2.3"
solana-keypair = "2.2"
solana-message = { version = "2.4", features = ["bincode"] }
solana-pubkey = "2.4"
solana-signature = { version = "2.3", features = ["verify"] }
solana-signer = "2.2"
solana-transaction = { version = "2.2", features = ["bincode"] }
bincode = "1.3"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rand = "0.8"
fs2 = "0.4"

[dev-dependencies]
axum = "0.8"
